<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metsinanat | Software Engineering Student</title>
    <!-- ሞዴር ፊደል ከ Google Fonts ለማምጣት -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent: #0d9488;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.7;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        nav {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            padding: 18px 24px;
            border-radius: 12px;
            display: flex;
            gap: 20px;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
            margin-bottom: 30px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        nav a:hover {
            opacity: 0.85;
            transform: translateY(-1px);
        }

        hr {
            border: none;
            height: 1px;
            background-color: #e2e8f0;
            margin: 30px 0;
        }

        h1 {
            color: var(--text-main);
            font-size: 2.2rem;
            margin-bottom: 15px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        h1 em {
            font-style: normal;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h2 {
            color: var(--primary-dark);
            font-size: 1.4rem;
            margin-top: 25px;
            margin-bottom: 12px;
            font-weight: 600;
        }

        h3 {
            color: var(--text-main);
            font-size: 1.1rem;
            margin-top: 20px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        p {
            color: var(--text-muted);
            margin-bottom: 12px;
            font-size: 1.05rem;
        }

        ul {
            list-style: none;
            padding-left: 0;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-top: 10px;
        }

        ul li {
            background-color: #f1f5f9;
            padding: 12px 18px;
            border-radius: 10px;
            font-weight: 500;
            color: var(--text-main);
            border-left: 4px solid var(--accent);
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        ul li:hover {
            transform: translateY(-2px);
            background-color: #e2e8f0;
        }
    </style>
</head>
<body>

    <div class="container">
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact me</a>
        </nav>

        <h1><em>Welcome to My Website</em></h1>

        <h2>About Me</h2>
        <p>Hello! My name is Metsinanat.</p>
        <p>I am a Software Engineering student.</p>
        
        <hr>

        <h2>My Goals</h2>
        <p>I want to build useful software projects.</p>

        <h3><b>My Hobbies</b></h3>
        <ul>
            <li>Reading</li>
            <li>Playing Guitar</li>
            <li>Watching Movies</li>
        </ul>
    </div>

</body>
</html>
